{{- include "karta.validateFipsMode" . -}}
{{- if .Values.crdUpgrader.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "karta.crdUpgrader.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "karta.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "2"
    "helm.sh/hook-delete-policy": hook-succeeded,before-hook-creation
spec:
  backoffLimit: {{ .Values.crdUpgrader.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "karta.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "karta.crdUpgrader.name" . }}
      restartPolicy: OnFailure
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.crdUpgrader.podSecurityContext | nindent 8 }}
      containers:
        - name: crd-upgrader
          image: "{{ .Values.crdUpgrader.image.repository }}:{{ .Values.crdUpgrader.image.tag }}"
          imagePullPolicy: {{ .Values.crdUpgrader.image.pullPolicy }}
          args:
            - apply
            - --server-side
            - --force-conflicts
            - --field-manager=karta-crd-upgrader
            - -f
            - /crds/
          env:
            - name: KUBECACHEDIR
              value: /tmp/kube-cache
            {{- if ne .Values.fipsMode "off" }}
            - name: GODEBUG
              value: {{ if eq .Values.fipsMode "only" }}"fips140=only,tlsmlkem=0"{{ else }}"fips140={{ .Values.fipsMode }}"{{ end }}
            {{- end }}
          volumeMounts:
            - name: crds
              mountPath: /crds
              readOnly: true
            - name: cache
              mountPath: /tmp
          resources:
            {{- toYaml .Values.crdUpgrader.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.crdUpgrader.securityContext | nindent 12 }}
      volumes:
        - name: crds
          configMap:
            name: {{ include "karta.crdUpgrader.name" . }}
        - name: cache
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end -}}
