kind: Karta
apiVersion: run.ai/v1alpha1
metadata:
  name: apps-nvidia-com-nimcache-v1alpha1
spec:
  structureDefinition:
    rootComponent:
      name: nimcache
      kind:
        group: apps.nvidia.com
        version: v1alpha1
        kind: NIMCache
      specDefinition:
        fragmentedPodSpecDefinition:
          resourcesPath: '{requests: .spec.resources}'
      scaleDefinition:
        replicasPath: "1"
      statusDefinition:
        phaseDefinition:
          path: .status.state
        conditionsDefinition:
          path: .status.conditions
          typeFieldName: type
          statusFieldName: status
          messageFieldName: message
          reasonFieldName: reason
        statusMappings:
          pending:
            - byPhase: Pending
            - byPhase: NotReady
          progressing:
            - byPhase: PVC-Created
            - byPhase: Started
          running:
            - byPhase: InProgress
          completed:
            - byPhase: Ready
              byConditions:
                - type: NIM_CACHE_JOB_COMPLETED
                  status: "True"
          failed:
            - byPhase: Failed
  optimizationInstructions: {}
