apiVersion: apps/v1
kind: Deployment
metadata:
  name: generic-controller
  namespace: karta-system
  labels:
    app.kubernetes.io/name: generic-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: generic-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: generic-controller
    spec:
      serviceAccountName: generic-controller
      containers:
        - name: controller
          # Temp validation image for the Brev Launchable PoC, pushed manually
          # to a personal ghcr namespace. Not the final published location.
          image: ghcr.io/lavianalon/karta-controller-poc:latest
          # Always, not IfNotPresent: the temp image is iterating on a :latest
          # tag while validating the Brev Launchable, so a stale local cache
          # must not shadow a newer push.
          imagePullPolicy: Always
          # Workload types to manage, as group/version/kind (core group empty).
          # Add a type here, apply its Karta object, and grant RBAC below.
          args:
            - --watch-gvk=leaderworkerset.x-k8s.io/v1/LeaderWorkerSet
          ports:
            - name: metrics
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
