name: Pull Request

on:
  push:
    branches: [ main, v0.* ]
  pull_request:
    branches: [ main, v0.* ]

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true
          cache-dependency-path: |
            go.sum
            operator/go.sum
            cli/go.sum

      - name: Cache bin tools
        uses: actions/cache@v6
        with:
          path: bin
          key: ${{ runner.os }}-bin-${{ hashFiles('Makefile') }}-${{ hashFiles('go.mod') }}
          restore-keys: |
            ${{ runner.os }}-bin-${{ hashFiles('Makefile') }}-
            ${{ runner.os }}-bin-

      - name: Run checks
        run: make check

      - name: Lint helm chart
        run: make helm-lint

      - name: Validate helm chart renders
        run: make helm-validate

      - name: Verify air-gap image lock coverage
        run: make image-lock-verify

      - name: Test air-gap image lock generator
        run: make image-lock-test

      - name: Lint shell scripts
        run: make lint-shell

  controller-e2e:
    name: Controller E2E
    runs-on: ubuntu-latest
    # A hung provision otherwise burns the 360 minute default.
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true
          cache-dependency-path: |
            go.sum
            operator/go.sum

      # Base only: the controller suite touches no workload operator, and installing
      # the ten of them would dominate the job.
      - name: Provision cluster
        run: make e2e-up WORKLOADS=none

      - name: Run controller e2e
        run: make test-e2e

      - name: Collect diagnostics
        if: always()
        run: kind export logs .artifacts/kind --name karta-e2e || true

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: controller-e2e-artifacts
          path: .artifacts/
          if-no-files-found: ignore

      - name: Tear down
        if: always()
        run: make e2e-down

  headlamp-plugin-ci:
    name: Headlamp Plugin Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Build Headlamp plugin
        run: make headlamp-plugin-build
